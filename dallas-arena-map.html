    ];

    // ── Sector & metadata ──
    const SECTORS = {
      1:'Southern Dallas',3:'Southern Dallas',4:'Southern Dallas',5:'Southern Dallas',7:'Southern Dallas',8:'Southern Dallas',
      10:'North Dallas',11:'North Dallas',12:'North Dallas',13:'North Dallas',
      2:'Central',14:'Central',
      6:'West Dallas',
      9:'East Dallas'
    };
    const SECTOR_COLORS = {
      'Southern Dallas':'#DC2626','North Dallas':'#6B7280','Central':'#3B82F6','West Dallas':'#EA580C','East Dallas':'#8B5CF6'
    };
    const SOUTHERN_DISTRICTS = [1,3,4,5,7,8];

    // ── Arena sites ──
    const DOWNTOWN = { lat: 32.7762, lng: -96.7997, label: 'Downtown Site' };
    const VALLEY_VIEW = { lat: 32.9290, lng: -96.8030, label: 'Valley View Site' };
    const CURRENT_AAC = { lat: 32.7905, lng: -96.8103, label: 'Current AAC' };

    // ── Haversine distance (miles) ──
    function haversine(lat1, lon1, lat2, lon2) {
      const R = 3958.8;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // ── Precompute distances ──
    const districtData = DISTRICTS.map(d => {
      const dtDist = haversine(d.c[0], d.c[1], DOWNTOWN.lat, DOWNTOWN.lng);
      const vvDist = haversine(d.c[0], d.c[1], VALLEY_VIEW.lat, VALLEY_VIEW.lng);
      return {
        ...d,
        sector: SECTORS[d.d],
        sectorColor: SECTOR_COLORS[SECTORS[d.d]],
        dtDist: Math.round(dtDist * 100) / 100,
        vvDist: Math.round(vvDist * 100) / 100,
        delta: Math.round((vvDist - dtDist) * 100) / 100,
        isSouthern: SOUTHERN_DISTRICTS.includes(d.d)
      };
    });

    // ── Color logic ──
    function getDistrictColor(dist, radius, mode) {
      const inDT = dist.dtDist <= radius;
      const inVV = dist.vvDist <= radius;

      if (mode === 'downtown') {
        return inDT ? '#22C55E' : '#4B5563';
      }
      if (mode === 'valleyview') {
        return inVV ? '#3B82F6' : '#4B5563';
      }
      // compare mode
      if (inDT && inVV) return '#22C55E';    // green: both
      if (inDT && !inVV) return '#DC2626';   // red: loses access
      if (!inDT && inVV) return '#3B82F6';   // blue: VV only
      return '#4B5563';                       // gray: neither
    }

    function getColorLabel(dist, radius, mode) {
      const inDT = dist.dtDist <= radius;
      const inVV = dist.vvDist <= radius;
      if (mode === 'downtown') return inDT ? 'Within radius' : 'Outside radius';
      if (mode === 'valleyview') return inVV ? 'Within radius' : 'Outside radius';
      if (inDT && inVV) return 'Accessible from both sites';
      if (inDT && !inVV) return 'LOSES access at Valley View';
      if (!inDT && inVV) return 'Only Valley View';
      return 'Outside both radii';
    }

    // ── Main App ──
    function App() {
      const [radius, setRadius] = useState(8);
      const [mode, setMode] = useState('compare');
      const mapRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const layersRef = useRef({ districts: [], circles: [], markers: [], labels: [] });

      // Stats
      const stats = useMemo(() => {
        const inDT = districtData.filter(d => d.dtDist <= radius).length;
        const inVV = districtData.filter(d => d.vvDist <= radius).length;
        const southernLosing = districtData.filter(d => d.isSouthern && d.dtDist <= radius && d.vvDist > radius);
        return { inDT, inVV, southernLosing, radius };
      }, [radius]);

      const sortedDistricts = useMemo(() => {
        return [...districtData].sort((a, b) => {
          const aLoses = a.dtDist <= radius && a.vvDist > radius;
          const bLoses = b.dtDist <= radius && b.vvDist > radius;
          if (aLoses && !bLoses) return -1;
          if (!aLoses && bLoses) return 1;
          return b.delta - a.delta;
        });
      }, [radius]);

      // Initialize map
      useEffect(() => {
        if (mapInstanceRef.current) return;
        const map = L.map(mapRef.current, {
          center: [32.82, -96.77],
          zoom: 11,
          zoomControl: false,
          attributionControl: false
        });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          maxZoom: 19
        }).addTo(map);

        L.control.zoom({ position: 'topleft' }).addTo(map);
        L.control.attribution({ position: 'bottomleft', prefix: false })
          .addAttribution('&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://www.openstreetmap.org/">OSM</a> | District data: City of Dallas GIS')
          .addTo(map);

        mapInstanceRef.current = map;

        // Force resize after mount
        setTimeout(() => map.invalidateSize(), 100);
      }, []);

      // Update map layers
      useEffect(() => {
        const map = mapInstanceRef.current;
        if (!map) return;

        // Clear old layers
        layersRef.current.districts.forEach(l => map.removeLayer(l));
        layersRef.current.circles.forEach(l => map.removeLayer(l));
        layersRef.current.markers.forEach(l => map.removeLayer(l));
        layersRef.current.labels.forEach(l => map.removeLayer(l));
        layersRef.current = { districts: [], circles: [], markers: [], labels: [] };

        // Draw district polygons
        districtData.forEach(dist => {
          const color = getDistrictColor(dist, radius, mode);
          const latlngs = dist.coords[0].map(c => [c[1], c[0]]);
          const poly = L.polygon(latlngs, {
            fillColor: color,
            fillOpacity: 0.45,
            color: '#C8A951',
            weight: 1.5,
            opacity: 0.7
          }).addTo(map);

          // Hover tooltip
          const statusLabel = getColorLabel(dist, radius, mode);
          poly.bindTooltip(
            `<div style="line-height:1.5">
              <strong style="color:#C8A951;font-size:13px">District ${dist.d}</strong><br/>
              <span style="color:#94A3B8">${dist.m}</span><br/>
              <span style="color:${dist.sectorColor}">${dist.sector}</span><br/>
              <hr style="border:0;border-top:1px solid #374151;margin:4px 0"/>
              Downtown: <strong>${dist.dtDist.toFixed(1)} mi</strong><br/>
              Valley View: <strong>${dist.vvDist.toFixed(1)} mi</strong><br/>
              Delta: <strong style="color:${dist.delta > 0 ? '#F87171' : '#4ADE80'}">${dist.delta > 0 ? '+' : ''}${dist.delta.toFixed(1)} mi</strong><br/>
              <span style="color:${color};font-weight:600">${statusLabel}</span>
            </div>`,
            { className: 'hover-tooltip', sticky: true, direction: 'right', offset: [12, 0] }
          );

          layersRef.current.districts.push(poly);

          // District number label
          const label = L.tooltip({
            permanent: true,
            direction: 'center',
            className: 'district-tooltip',
            offset: [0, 0]
          });
          label.setContent(`D${dist.d}`);
          label.setLatLng([dist.c[0], dist.c[1]]);
          label.addTo(map);
          layersRef.current.labels.push(label);
        });

        // Draw radius circles
        const milesToMeters = 1609.34;
        if (mode === 'compare' || mode === 'downtown') {
          const dtCircle = L.circle([DOWNTOWN.lat, DOWNTOWN.lng], {
            radius: radius * milesToMeters,
            color: '#22C55E',
            weight: 2,
            dashArray: '8, 6',
            fillOpacity: 0.03,
            fillColor: '#22C55E'
          }).addTo(map);
          layersRef.current.circles.push(dtCircle);
        }
        if (mode === 'compare' || mode === 'valleyview') {
          const vvCircle = L.circle([VALLEY_VIEW.lat, VALLEY_VIEW.lng], {
            radius: radius * milesToMeters,
            color: '#3B82F6',
            weight: 2,
            dashArray: '8, 6',
            fillOpacity: 0.03,
            fillColor: '#3B82F6'
          }).addTo(map);
          layersRef.current.circles.push(vvCircle);
        }

        // Site markers
        const createIcon = (color, label) => L.divIcon({
          className: '',
          html: `<div style="
            width:14px;height:14px;border-radius:50%;
            background:${color};border:2px solid #fff;
            box-shadow:0 0 8px ${color}88;
          "></div>`,
          iconSize: [14, 14],
          iconAnchor: [7, 7]
        });

        if (mode === 'compare' || mode === 'downtown') {
          const dtMarker = L.marker([DOWNTOWN.lat, DOWNTOWN.lng], {
            icon: createIcon('#22C55E', 'DT')
          }).addTo(map).bindTooltip('Downtown Arena Site', {
            className: 'hover-tooltip', direction: 'top', offset: [0, -10]
          });
          layersRef.current.markers.push(dtMarker);
        }
        if (mode === 'compare' || mode === 'valleyview') {
          const vvMarker = L.marker([VALLEY_VIEW.lat, VALLEY_VIEW.lng], {
            icon: createIcon('#3B82F6', 'VV')
          }).addTo(map).bindTooltip('Valley View Arena Site', {
            className: 'hover-tooltip', direction: 'top', offset: [0, -10]
          });
          layersRef.current.markers.push(vvMarker);
        }

        // Current AAC marker (always show)
        const aacMarker = L.marker([CURRENT_AAC.lat, CURRENT_AAC.lng], {
          icon: L.divIcon({
            className: '',
            html: `<div style="
              width:10px;height:10px;border-radius:50%;
              background:#C8A951;border:2px solid #fff;
              box-shadow:0 0 6px #C8A95188;
            "></div>`,
            iconSize: [10, 10],
            iconAnchor: [5, 5]
          })
        }).addTo(map).bindTooltip('Current American Airlines Center', {
          className: 'hover-tooltip', direction: 'top', offset: [0, -8]
        });
        layersRef.current.markers.push(aacMarker);

      }, [radius, mode]);

      const modeButtons = [
        { key: 'compare', label: 'Compare' },
        { key: 'downtown', label: 'Downtown Only' },
        { key: 'valleyview', label: 'Valley View Only' }
      ];

      return (
        <div style={{ height: '100vh', display: 'flex', flexDirection: 'column', background: '#0B0F19' }}>
          {/* Header */}
          <div style={{
            background: 'linear-gradient(135deg, #111827 0%, #1E293B 100%)',
            borderBottom: '2px solid #C8A951',
            padding: '10px 24px',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            flexShrink: 0
          }}>
            <div>
              <div style={{ fontSize: 11, letterSpacing: 2, color: '#C8A951', fontWeight: 600, textTransform: 'uppercase' }}>
                Dallas City Council Briefing — February 2026
              </div>
              <div style={{ fontSize: 20, fontWeight: 700, color: '#F1F5F9', marginTop: 2 }}>
                Arena Site Accessibility: Downtown vs. Valley View
              </div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
              <div style={{ display: 'flex', gap: 4 }}>
                {modeButtons.map(b => (
                  <button key={b.key} onClick={() => setMode(b.key)} style={{
                    padding: '6px 14px',
                    fontSize: 12,
                    fontWeight: 600,
                    border: 'none',
                    borderRadius: 4,
                    cursor: 'pointer',
                    background: mode === b.key ? '#C8A951' : '#1E293B',
                    color: mode === b.key ? '#0B0F19' : '#94A3B8',
                    transition: 'all 0.2s'
                  }}>{b.label}</button>
                ))}
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ fontSize: 12, color: '#94A3B8' }}>Radius:</span>
                <input
                  type="range" min="3" max="15" step="0.5" value={radius}
                  onChange={e => setRadius(parseFloat(e.target.value))}
                  style={{ width: 120, accentColor: '#C8A951' }}
                />
                <span style={{
                  fontSize: 13, fontWeight: 700, color: '#C8A951',
                  background: '#1E293B', padding: '3px 8px', borderRadius: 4,
                  minWidth: 52, textAlign: 'center'
                }}>{radius} mi</span>
              </div>
            </div>
          </div>

          {/* Main content */}
          <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
            {/* Map */}
            <div style={{ flex: 1, position: 'relative' }}>
              <div ref={mapRef} style={{ width: '100%', height: '100%' }} />
              {/* Legend */}
              <div style={{
                position: 'absolute', bottom: 24, right: 16, zIndex: 1000,
                background: '#111827ee', borderRadius: 8, padding: '12px 16px',
                border: '1px solid #374151', fontSize: 11
              }}>
                <div style={{ fontWeight: 700, color: '#C8A951', marginBottom: 6, fontSize: 12 }}>Legend</div>
                {mode === 'compare' ? (
                  <>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 3 }}>
                      <div style={{ width: 12, height: 12, borderRadius: 2, background: '#22C55E' }} />
                      <span>Both sites accessible</span>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 3 }}>
                      <div style={{ width: 12, height: 12, borderRadius: 2, background: '#DC2626' }} />
                      <span>Loses access at Valley View</span>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 3 }}>
                      <div style={{ width: 12, height: 12, borderRadius: 2, background: '#3B82F6' }} />
                      <span>Valley View only</span>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                      <div style={{ width: 12, height: 12, borderRadius: 2, background: '#4B5563' }} />
                      <span>Outside both radii</span>
                    </div>
                  </>
                ) : (
                  <>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 3 }}>
                      <div style={{ width: 12, height: 12, borderRadius: 2, background: mode === 'downtown' ? '#22C55E' : '#3B82F6' }} />
                      <span>Within radius</span>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                      <div style={{ width: 12, height: 12, borderRadius: 2, background: '#4B5563' }} />
                      <span>Outside radius</span>
                    </div>
                  </>
                )}
                <hr style={{ border: 0, borderTop: '1px solid #374151', margin: '6px 0' }} />
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 3 }}>
                  <div style={{ width: 10, height: 10, borderRadius: '50%', background: '#22C55E', border: '1.5px solid #fff' }} />
                  <span>Downtown site</span>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 3 }}>
                  <div style={{ width: 10, height: 10, borderRadius: '50%', background: '#3B82F6', border: '1.5px solid #fff' }} />
                  <span>Valley View site</span>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                  <div style={{ width: 8, height: 8, borderRadius: '50%', background: '#C8A951', border: '1.5px solid #fff' }} />
                  <span>Current AAC</span>
                </div>
              </div>
            </div>

            {/* Sidebar */}
            <div style={{
              width: 310, flexShrink: 0, background: '#111827',
              borderLeft: '1px solid #1E293B', overflowY: 'auto',
              display: 'flex', flexDirection: 'column'
            }}>
              {/* Stat cards */}
              <div style={{ padding: '12px 14px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
                <StatCard label="Downtown Radius" value={`${stats.inDT} / 14`} sub="districts" color="#22C55E" />
                <StatCard label="Valley View Radius" value={`${stats.inVV} / 14`} sub="districts" color="#3B82F6" />
                <StatCard label="Southern Losing" value={stats.southernLosing.length} sub="districts" color="#DC2626" />
                <StatCard label="Current Radius" value={`${radius} mi`} sub="adjustable" color="#C8A951" />
              </div>

              {/* Equity callout */}
              {stats.southernLosing.length > 0 && (
                <div style={{
                  margin: '0 14px 8px', padding: '10px 12px',
                  background: '#1E293B', borderRadius: 6,
                  borderLeft: '3px solid #DC2626'
                }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: '#DC2626', marginBottom: 4, textTransform: 'uppercase', letterSpacing: 0.5 }}>
                    Equity Impact
                  </div>
                  <div style={{ fontSize: 12, color: '#E2E8F0', lineHeight: 1.5 }}>
                    At {radius} mi radius, <strong style={{ color: '#F87171' }}>
                    {stats.southernLosing.length} Southern Dallas district{stats.southernLosing.length !== 1 ? 's' : ''}
                    </strong> lose{stats.southernLosing.length === 1 ? 's' : ''} access:
                    {' '}{stats.southernLosing.map(d => `D${d.d}`).join(', ')}.
                  </div>
                  <div style={{ fontSize: 11, color: '#94A3B8', marginTop: 6, lineHeight: 1.4 }}>
                    These voters provided the <strong style={{ color: '#C8A951' }}>1,642-vote margin</strong> in the 1998 arena bond election.
                  </div>
                </div>
              )}

              {/* Transit callout */}
              <div style={{
                margin: '0 14px 8px', padding: '10px 12px',
                background: '#1E293B', borderRadius: 6,
                borderLeft: '3px solid #3B82F6'
              }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: '#3B82F6', marginBottom: 4, textTransform: 'uppercase', letterSpacing: 0.5 }}>
                  Transit Access
                </div>
                <div style={{ fontSize: 12, color: '#E2E8F0', lineHeight: 1.5 }}>
                  <strong>Downtown:</strong> DART Victory Station — <span style={{ color: '#22C55E' }}>Green</span>, <span style={{ color: '#EA580C' }}>Orange</span>, <span style={{ color: '#DC2626' }}>Red</span>, <span style={{ color: '#3B82F6' }}>Blue</span> lines
                </div>
                <div style={{ fontSize: 12, color: '#E2E8F0', lineHeight: 1.5, marginTop: 3 }}>
                  <strong>Valley View:</strong> <span style={{ color: '#F87171' }}>Zero rail access</span>
                </div>
              </div>

              {/* Distance table */}
              <div style={{ flex: 1, padding: '0 14px 14px' }}>
                <div style={{ fontSize: 12, fontWeight: 700, color: '#C8A951', marginBottom: 8 }}>
                  District Impact Analysis
                </div>
                <div style={{ fontSize: 10, color: '#64748B', marginBottom: 6, display: 'flex', justifyContent: 'space-between', padding: '0 4px' }}>
                  <span style={{ width: 60 }}>District</span>
                  <span style={{ width: 50, textAlign: 'right' }}>DT</span>
                  <span style={{ width: 50, textAlign: 'right' }}>VV</span>
                  <span style={{ width: 50, textAlign: 'right' }}>Delta</span>
                </div>
                {sortedDistricts.map(dist => {
                  const losesAccess = dist.dtDist <= radius && dist.vvDist > radius;
                  return (
                    <div key={dist.d} style={{
                      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                      padding: '5px 4px', fontSize: 11,
                      borderLeft: losesAccess ? '3px solid #DC2626' : '3px solid transparent',
                      background: losesAccess ? '#DC262610' : 'transparent',
                      borderRadius: 2, marginBottom: 1
                    }}>
                      <span style={{ width: 60 }}>
                        <strong style={{ color: dist.sectorColor }}>D{dist.d}</strong>
                        <span style={{ color: '#64748B', fontSize: 9, marginLeft: 3 }}>{dist.sector.split(' ')[0]}</span>
                      </span>
                      <span style={{ width: 50, textAlign: 'right', color: dist.dtDist <= radius ? '#4ADE80' : '#94A3B8' }}>
                        {dist.dtDist.toFixed(1)}
                      </span>
                      <span style={{ width: 50, textAlign: 'right', color: dist.vvDist <= radius ? '#60A5FA' : '#94A3B8' }}>
                        {dist.vvDist.toFixed(1)}
                      </span>
                      <span style={{
                        width: 50, textAlign: 'right', fontWeight: 600,
                        color: dist.delta > 2 ? '#F87171' : dist.delta < -2 ? '#4ADE80' : '#94A3B8'
                      }}>
                        {dist.delta > 0 ? '+' : ''}{dist.delta.toFixed(1)}
                      </span>
                    </div>
                  );
                })}
                <div style={{ fontSize: 9, color: '#475569', marginTop: 8, lineHeight: 1.4 }}>
                  Distances are haversine straight-line from district centroids. Delta = VV distance minus DT distance (positive = farther from Valley View).
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── Stat Card Component ──
    function StatCard({ label, value, sub, color }) {
      return (
        <div style={{
          background: '#1E293B', borderRadius: 6, padding: '10px 12px',
          borderTop: `2px solid ${color}`
        }}>
          <div style={{ fontSize: 10, color: '#94A3B8', textTransform: 'uppercase', letterSpacing: 0.5 }}>{label}</div>
          <div style={{ fontSize: 22, fontWeight: 800, color, marginTop: 2 }}>{value}</div>
          <div style={{ fontSize: 10, color: '#64748B' }}>{sub}</div>
        </div>
      );
    }

    // ── Render ──
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
