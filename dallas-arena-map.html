    // ── Haversine distance (miles) ──
    function haversine(lat1, lon1, lat2, lon2) {
      const R = 3958.8;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    const DISTRICT_POP = {1:77916,2:95419,3:96451,4:89916,5:81942,6:87191,7:96173,8:100474,9:89882,10:98464,11:93975,12:98347,13:91161,14:106927};

    // ── Point-in-polygon (ray casting) ──
    function pointInPolygon(lat, lng, polygon) {
      let inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const xi = polygon[i][1], yi = polygon[i][0];
        const xj = polygon[j][1], yj = polygon[j][0];
        if (((yi > lng) !== (yj > lng)) && (lat < (xj - xi) * (lng - yi) / (yj - yi) + xi)) {
          inside = !inside;
        }
      }
      return inside;
    }

    // ── Sample grid points within a district polygon for area coverage estimation ──
    function sampleDistrictGrid(coords, step) {
      step = step || 0.004;
      const polygon = coords[0];
      let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
      for (let k = 0; k < polygon.length; k++) {
        const lng = polygon[k][0], lat = polygon[k][1];
        if (lat < minLat) minLat = lat;
        if (lat > maxLat) maxLat = lat;
        if (lng < minLng) minLng = lng;
        if (lng > maxLng) maxLng = lng;
      }
      const points = [];
      for (let lat = minLat; lat <= maxLat; lat += step) {
        for (let lng = minLng; lng <= maxLng; lng += step) {
          if (pointInPolygon(lat, lng, polygon)) {
            points.push([lat, lng]);
          }
        }
      }
      return points;
    }

    // ── Coverage fraction: what share of a district's area falls within radius of a site ──
    function coverageFraction(sampleDists, radius, site) {
      if (!sampleDists || sampleDists.length === 0) return 0;
      let count = 0;
      for (let i = 0; i < sampleDists.length; i++) {
        if (sampleDists[i][site] <= radius) count++;
      }
      return count / sampleDists.length;
    }

    // ── Precompute distances (centroid + grid sample points) ──
    const districtData = DISTRICTS.map(d => {

        vv: haversine(p[0], p[1], VALLEY_VIEW.lat, VALLEY_VIEW.lng)

        sector: SECTORS[d.d],

        vvDist: Math.round(vvDist * 100) / 100,

        pop: DISTRICT_POP[d.d],

    // ── Color logic (uses area coverage to detect partial overlap) ──
    function getDistrictColor(dist, radius, mode) {
      const dtCov = coverageFraction(dist.sampleDists, radius, 'dt');
      const vvCov = coverageFraction(dist.sampleDists, radius, 'vv');
      const hasDT = dtCov > 0;
      const hasVV = vvCov > 0;

      if (mode === 'downtown') {
        return hasDT ? '#22C55E' : '#4B5563';
      }
      if (mode === 'valleyview') {
        return hasVV ? '#3B82F6' : '#4B5563';
      }
      // compare mode
      if (hasDT && hasVV) return '#22C55E';    // green: both
      if (hasDT && !hasVV) return '#DC2626';   // red: loses access
      if (!hasDT && hasVV) return '#3B82F6';   // blue: VV only
      return '#4B5563';                         // gray: neither
    }

    function getColorLabel(dist, radius, mode) {
      const dtCov = coverageFraction(dist.sampleDists, radius, 'dt');
      const vvCov = coverageFraction(dist.sampleDists, radius, 'vv');
      const hasDT = dtCov > 0;
      const hasVV = vvCov > 0;
      const dtPct = (dtCov * 100).toFixed(0);
      const vvPct = (vvCov * 100).toFixed(0);
      if (mode === 'downtown') return hasDT ? `${dtPct}% within radius` : 'Outside radius';
      if (mode === 'valleyview') return hasVV ? `${vvPct}% within radius` : 'Outside radius';
      if (hasDT && hasVV) return `Accessible from both (DT ${dtPct}% / VV ${vvPct}%)`;
      if (hasDT && !hasVV) return `LOSES access at Valley View (DT ${dtPct}% covered)`;
      if (!hasDT && hasVV) return `Only Valley View (${vvPct}% covered)`;
      return 'Outside both radii';
    }

      const dtMaxDist = Math.max(...districtData.map(d => d.dtDist));
      const vvMaxDist = Math.max(...districtData.map(d => d.vvDist));

      // Stats (area-weighted: a district counts if ANY part of its area falls within the radius)
      const stats = useMemo(() => {
        const withCoverage = districtData.map(d => ({
          ...d,
          dtCov: coverageFraction(d.sampleDists, radius, 'dt'),
          vvCov: coverageFraction(d.sampleDists, radius, 'vv')
        }));
        const inDT = withCoverage.filter(d => d.dtCov > 0);
        const inVV = withCoverage.filter(d => d.vvCov > 0);
        const southernInDT = withCoverage.filter(d => d.isSouthern && d.dtCov > 0);
        const southernInVV = withCoverage.filter(d => d.isSouthern && d.vvCov > 0);
        const southernLosing = withCoverage.filter(d => d.isSouthern && d.dtCov > 0 && d.vvCov === 0);
        // Area-weighted population: proportional to how much of each district falls within the radius circle
        const popDT = Math.round(withCoverage.reduce((s, d) => s + d.pop * d.dtCov, 0));
        const popVV = Math.round(withCoverage.reduce((s, d) => s + d.pop * d.vvCov, 0));
        return { inDT:inDT.length, inVV:inVV.length, southernInDT:southernInDT.length, southernInVV:southernInVV.length, southernLosing, popDT, popVV, coverageGap:inDT.length-inVV.length };
      }, [radius]);

      // Dynamic insight text
      const insight = useMemo(() => {
        const {inDT,inVV,southernInDT,southernInVV,coverageGap,popDT,popVV} = stats;
        if (coverageGap > 0) return `At ${radius} mi, Downtown covers ${coverageGap} more district${coverageGap!==1?'s':''} than Valley View (${inDT} vs ${inVV}), reaching ${popDT.toLocaleString()} residents vs ${popVV.toLocaleString()}. Downtown serves ${southernInDT}/6 Southern districts; Valley View serves ${southernInVV}/6.`;
        if (coverageGap === 0) return `At ${radius} mi, both sites cover ${inDT} districts (${popDT.toLocaleString()} residents) — but Downtown reaches ${southernInDT}/6 Southern Dallas districts vs Valley View's ${southernInVV}/6.`;
        return `At ${radius} mi, Valley View covers ${-coverageGap} more district${-coverageGap!==1?'s':''} (${inVV} vs ${inDT}). However, Downtown still reaches ${southernInDT}/6 Southern districts vs Valley View's ${southernInVV}/6.`;
      }, [stats, radius]);

      // Initialize map
      useEffect(() => {
        if (mapInstanceRef.current) return;
        const map = L.map(mapRef.current, {
          center: [32.82, -96.77],
          zoom: 11,
          zoomControl: false,
          attributionControl: false
        });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          maxZoom: 19
        }).addTo(map);

        // Draw DART rail lines (static — drawn once beneath district layers)
        const DART_LINE_COLORS = { RED: '#FD3E3E', BLUE: '#198BC3', GREEN: '#006F38', ORANGE: '#F68B1F' };
        DART_RAIL.lines.forEach(line => {
          const latlngs = line.p.map(c => [c[1], c[0]]);
          L.polyline(latlngs, {
            color: line.c,
            weight: 2.5,
            opacity: 0.55,
            dashArray: '6, 4',
            interactive: false
          }).addTo(map);
        });

        // Draw DART stations (small dots, deduplicated by name)
        const drawnStations = new Set();
        DART_RAIL.stations.forEach(s => {
          if (drawnStations.has(s.n)) return;
          drawnStations.add(s.n);
          const lines = DART_RAIL.stations.filter(st => st.n === s.n).map(st => st.l);
          L.circleMarker([s.p[1], s.p[0]], {
            radius: 3,
            fillColor: '#fff',
            color: DART_LINE_COLORS[lines[0]],
            weight: 1.5,
            fillOpacity: 0.8,
            opacity: 0.7
          }).bindTooltip(
            `<div style="line-height:1.4">
              <strong style="color:#C8A951">${s.n.replace(' STATION', '')}</strong><br/>
              <span style="font-size:11px">${lines.map(l => '<span style="color:' + DART_LINE_COLORS[l] + '">' + l + '</span>').join(' · ')}</span>
            </div>`,
            { className: 'hover-tooltip', direction: 'right', offset: [8, 0] }
          ).addTo(map);
        });

        L.control.zoom({ position: 'topleft' }).addTo(map);
        L.control.attribution({ position: 'bottomleft', prefix: false })
          .addAttribution('&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://www.openstreetmap.org/">OSM</a> | District data: City of Dallas GIS | Rail: DART GTFS')
          .addTo(map);

        mapInstanceRef.current = map;

        // Force resize after mount
        setTimeout(() => map.invalidateSize(), 100);
      }, []);

      // Update map layers
      useEffect(() => {
        const map = mapInstanceRef.current;
        if (!map) return;

        // Clear old layers
        layersRef.current.districts.forEach(l => map.removeLayer(l));
        layersRef.current.circles.forEach(l => map.removeLayer(l));
        layersRef.current.markers.forEach(l => map.removeLayer(l));
        layersRef.current.labels.forEach(l => map.removeLayer(l));
        layersRef.current = { districts: [], circles: [], markers: [], labels: [] };

        // Draw district polygons
        districtData.forEach(dist => {
          const color = getDistrictColor(dist, radius, mode);
          const dtCov = coverageFraction(dist.sampleDists, radius, 'dt');
          const vvCov = coverageFraction(dist.sampleDists, radius, 'vv');
          const maxCov = Math.max(dtCov, vvCov);
          const latlngs = dist.coords[0].map(c => [c[1], c[0]]);
          const poly = L.polygon(latlngs, {
            fillColor: color,
            fillOpacity: maxCov > 0 ? 0.2 + 0.35 * maxCov : 0.15,
            color: '#C8A951',
            weight: 1.5,
            opacity: 0.7
          }).addTo(map);

          // Hover tooltip
          const statusLabel = getColorLabel(dist, radius, mode);
          const dtCovPct = (dtCov * 100).toFixed(0);
          const vvCovPct = (vvCov * 100).toFixed(0);
          const dtPopReached = Math.round(dist.pop * dtCov).toLocaleString();
          const vvPopReached = Math.round(dist.pop * vvCov).toLocaleString();
          poly.bindTooltip(
            `<div style="line-height:1.5">
              <strong style="color:#C8A951;font-size:13px">District ${dist.d}</strong><br/>
              <span style="color:#94A3B8">${dist.m}</span><br/>
              <span style="color:${dist.sectorColor}">${dist.sector}</span><br/>
              <hr style="border:0;border-top:1px solid #374151;margin:4px 0"/>
              Downtown: <strong>${dist.dtDist.toFixed(1)} mi</strong> · <span style="color:${dtCov > 0 ? '#4ADE80' : '#64748B'}">${dtCovPct}% covered</span> · <span style="color:#94A3B8">${dtPopReached} residents</span><br/>
              Valley View: <strong>${dist.vvDist.toFixed(1)} mi</strong> · <span style="color:${vvCov > 0 ? '#60A5FA' : '#64748B'}">${vvCovPct}% covered</span> · <span style="color:#94A3B8">${vvPopReached} residents</span><br/>
              Delta: <strong style="color:${dist.delta > 0 ? '#F87171' : '#4ADE80'}">${dist.delta > 0 ? '+' : ''}${dist.delta.toFixed(1)} mi</strong><br/>
              <hr style="border:0;border-top:1px solid #374151;margin:4px 0"/>
              Pop: <strong>${(dist.pop).toLocaleString()}</strong> &nbsp;|&nbsp; Density: <strong>${(dist.density).toLocaleString()}</strong>/sq mi &nbsp;|&nbsp; Area: <strong>${dist.area}</strong> sq mi<br/>
              <span style="color:${color};font-weight:600">${statusLabel}</span>
            </div>`,
            { className: 'hover-tooltip', sticky: true, direction: 'right', offset: [12, 0] }
          );

          layersRef.current.districts.push(poly);

          // District number label (override positions for D2 & D14 whose centroids nearly overlap)
          const labelPos = dist.d === 2 ? [32.812, -96.825]
                         : dist.d === 14 ? [32.812, -96.755]
                         : [dist.c[0], dist.c[1]];
          const label = L.tooltip({
            permanent: true,
            direction: 'center',
            className: 'district-tooltip',
            offset: [0, 0]
          });
          label.setContent(`D${dist.d}`);
          label.setLatLng(labelPos);
          label.addTo(map);
          layersRef.current.labels.push(label);
        });

        // Draw radius circles
        const milesToMeters = 1609.34;
        if (mode === 'compare' || mode === 'downtown') {
          const dtCircle = L.circle([DOWNTOWN.lat, DOWNTOWN.lng], {
            radius: radius * milesToMeters,
            color: '#22C55E',
            weight: 2,
            dashArray: '8, 6',
            fillOpacity: 0.03,
            fillColor: '#22C55E'
          }).addTo(map);
          layersRef.current.circles.push(dtCircle);
        }
        if (mode === 'compare' || mode === 'valleyview') {
          const vvCircle = L.circle([VALLEY_VIEW.lat, VALLEY_VIEW.lng], {
            radius: radius * milesToMeters,
            color: '#3B82F6',
            weight: 2,
            dashArray: '8, 6',
            fillOpacity: 0.03,
            fillColor: '#3B82F6'
          }).addTo(map);
          layersRef.current.circles.push(vvCircle);
        }

        // Site markers
        const createIcon = (color, label) => L.divIcon({
          className: '',
          html: `<div style="
            width:14px;height:14px;border-radius:50%;
            background:${color};border:2px solid #fff;
            box-shadow:0 0 8px ${color}88;
          "></div>`,
          iconSize: [14, 14],
          iconAnchor: [7, 7]
        });

        if (mode === 'compare' || mode === 'downtown') {
          const dtMarker = L.marker([DOWNTOWN.lat, DOWNTOWN.lng], {
            icon: createIcon('#22C55E', 'DT')
          }).addTo(map).bindTooltip('Downtown Arena Site', {
            className: 'hover-tooltip', direction: 'top', offset: [0, -10]
          });
          layersRef.current.markers.push(dtMarker);
        }
        if (mode === 'compare' || mode === 'valleyview') {
          const vvMarker = L.marker([VALLEY_VIEW.lat, VALLEY_VIEW.lng], {
            icon: createIcon('#3B82F6', 'VV')
          }).addTo(map).bindTooltip('Valley View Arena Site', {
            className: 'hover-tooltip', direction: 'top', offset: [0, -10]
          });
          layersRef.current.markers.push(vvMarker);
        }

        // Current AAC marker (always show)
        const aacMarker = L.marker([CURRENT_AAC.lat, CURRENT_AAC.lng], {
          icon: L.divIcon({
            className: '',
            html: `<div style="
              width:10px;height:10px;border-radius:50%;
              background:#C8A951;border:2px solid #fff;
              box-shadow:0 0 6px #C8A95188;
            "></div>`,
            iconSize: [10, 10],
            iconAnchor: [5, 5]
          })
        }).addTo(map).bindTooltip('Current American Airlines Center', {
          className: 'hover-tooltip', direction: 'top', offset: [0, -8]
        });
        layersRef.current.markers.push(aacMarker);

      }, [radius, mode]);

      const modeButtons = [
        { key: 'compare', label: 'Compare' },
        { key: 'downtown', label: 'Downtown Only' },
        { key: 'valleyview', label: 'Valley View Only' }
      ];

      return (
        <div style={{ height: '100vh', display: 'flex', flexDirection: 'column', background: '#0B0F19' }}>
          {/* Header */}
          <div style={{
            background: 'linear-gradient(135deg, #111827 0%, #1E293B 100%)',
            borderBottom: '2px solid #C8A951',
            padding: isMobile ? '8px 12px' : '10px 24px',
            display: 'flex',
            flexDirection: isMobile ? 'column' : 'row',
            alignItems: isMobile ? 'stretch' : 'center',
            justifyContent: 'space-between',
            gap: isMobile ? 8 : 0,
            flexShrink: 0
          }}>
            <div>
              <div style={{ fontSize: isMobile ? 9 : 11, letterSpacing: 2, color: '#C8A951', fontWeight: 600, textTransform: 'uppercase' }}>
                Dallas City Council Briefing — February 2026
              </div>
              <div style={{ fontSize: isMobile ? 15 : 20, fontWeight: 700, color: '#F1F5F9', marginTop: 2 }}>
                Arena Site Accessibility: Downtown vs. Valley View
              </div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: isMobile ? 8 : 16, flexWrap: 'wrap' }}>
              <div style={{ display: 'flex', gap: 4 }}>
                {modeButtons.map(b => (
                  <button key={b.key} onClick={() => setMode(b.key)} style={{
                    padding: isMobile ? '6px 10px' : '6px 14px',
                    fontSize: isMobile ? 11 : 12,
                    fontWeight: 600,
                    border: 'none',
                    borderRadius: 4,
                    cursor: 'pointer',
                    background: mode === b.key ? '#C8A951' : '#1E293B',
                    color: mode === b.key ? '#0B0F19' : '#94A3B8',
                    transition: 'all 0.2s'
                  }}>{b.label}</button>
                ))}
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, flex: isMobile ? 1 : undefined }}>
                <span style={{ fontSize: 12, color: '#94A3B8' }}>Radius:</span>
                <input
                  type="range" min="3" max="15" step="0.5" value={radius}
                  onChange={e => setRadius(parseFloat(e.target.value))}
                  style={{ width: isMobile ? undefined : 120, flex: isMobile ? 1 : undefined, accentColor: '#C8A951' }}
                />
                <span style={{
                  fontSize: 13, fontWeight: 700, color: '#C8A951',
                  background: '#1E293B', padding: '3px 8px', borderRadius: 4,
                  minWidth: 52, textAlign: 'center'
                }}>{radius} mi</span>
              </div>
            </div>
          </div>

          {/* Main content */}
          <div style={{ flex: 1, display: 'flex', flexDirection: isMobile ? 'column' : 'row', overflow: 'hidden', position: 'relative' }}>
            {/* Map */}
            <div style={{ flex: 1, position: 'relative' }}>
              <div ref={mapRef} style={{ width: '100%', height: '100%' }} />

              {/* Mobile drawer toggle button */}
              {isMobile && (
                <button onClick={() => { setDrawerOpen(!drawerOpen); setTimeout(() => mapInstanceRef.current && mapInstanceRef.current.invalidateSize(), 350); }} style={{
                  position: 'absolute', bottom: 12, left: '50%', transform: 'translateX(-50%)',
                  zIndex: 1100, background: '#C8A951', color: '#0B0F19',
                  border: 'none', borderRadius: 20, padding: '8px 20px',
                  fontSize: 12, fontWeight: 700, cursor: 'pointer',
                  boxShadow: '0 2px 12px rgba(0,0,0,0.5)'
                }}>{drawerOpen ? 'Close Details' : 'View Details'}</button>
              )}

              {/* Legend */}
              <div style={{
                position: 'absolute', bottom: isMobile ? 52 : 24, right: isMobile ? 8 : 16, zIndex: 1000,
                background: '#111827ee', borderRadius: 8, padding: isMobile ? '8px 10px' : '12px 16px',
                border: '1px solid #374151', fontSize: isMobile ? 10 : 11
              }}>
                <div style={{ fontWeight: 700, color: '#C8A951', marginBottom: 6, fontSize: 12 }}>Legend</div>
                {mode === 'compare' ? (
                  <>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 3 }}>
                      <div style={{ width: 12, height: 12, borderRadius: 2, background: '#22C55E' }} />
                      <span>Both sites accessible</span>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 3 }}>
                      <div style={{ width: 12, height: 12, borderRadius: 2, background: '#DC2626' }} />
                      <span>Loses access at Valley View</span>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 3 }}>
                      <div style={{ width: 12, height: 12, borderRadius: 2, background: '#3B82F6' }} />
                      <span>Valley View only</span>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                      <div style={{ width: 12, height: 12, borderRadius: 2, background: '#4B5563' }} />
                      <span>Outside both radii</span>
                    </div>
                  </>
                ) : (
                  <>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 3 }}>
                      <div style={{ width: 12, height: 12, borderRadius: 2, background: mode === 'downtown' ? '#22C55E' : '#3B82F6' }} />
                      <span>Within radius</span>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                      <div style={{ width: 12, height: 12, borderRadius: 2, background: '#4B5563' }} />
                      <span>Outside radius</span>
                    </div>
                  </>
                )}
                <hr style={{ border: 0, borderTop: '1px solid #374151', margin: '6px 0' }} />
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 3 }}>
                  <div style={{ width: 10, height: 10, borderRadius: '50%', background: '#22C55E', border: '1.5px solid #fff' }} />
                  <span>Downtown site</span>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 3 }}>
                  <div style={{ width: 10, height: 10, borderRadius: '50%', background: '#3B82F6', border: '1.5px solid #fff' }} />
                  <span>Valley View site</span>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                  <div style={{ width: 8, height: 8, borderRadius: '50%', background: '#C8A951', border: '1.5px solid #fff' }} />
                  <span>Current AAC</span>
                </div>
              </div>
            </div>

            {/* Sidebar / Mobile Bottom Drawer */}
            <div style={{
              ...(isMobile ? {
                position: 'absolute', bottom: 0, left: 0, right: 0,
                maxHeight: '70vh',
                transform: drawerOpen ? 'translateY(0)' : 'translateY(100%)',
                transition: 'transform 0.3s ease-in-out',
                zIndex: 1200,
                borderTop: '2px solid #C8A951',
                borderRadius: '12px 12px 0 0'
              } : {
                width: 320, flexShrink: 0,
                borderLeft: '1px solid #1E293B'
              }),
              background: '#111827',
              overflowY: 'auto',
              display: 'flex', flexDirection: 'column'
            }}>
              {/* Mobile drawer handle */}
              {isMobile && (
                <div onClick={() => setDrawerOpen(false)} style={{
                  display: 'flex', justifyContent: 'center', padding: '8px 0 4px', cursor: 'pointer', flexShrink: 0
                }}>
                  <div style={{ width: 40, height: 4, borderRadius: 2, background: '#4B5563' }} />
                </div>
              )}
              {/* Dynamic Insight Banner */}
              <div style={{
                margin: '12px 14px 8px', padding: '10px 12px',
                background: 'linear-gradient(135deg, #1E293B 0%, #0F172A 100%)',
                borderRadius: 6, border: '1px solid #C8A951',
              }}>
                <div style={{ fontSize: 12, color: '#E2E8F0', lineHeight: 1.5 }}>{insight}</div>
              </div>

              {/* Coverage Comparison Bars */}
              <div style={{ padding: '0 14px 8px' }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: '#C8A951', marginBottom: 6, textTransform: 'uppercase', letterSpacing: 0.5 }}>
                  District Coverage at {radius} mi
                </div>
                {/* All districts bar */}
                <div style={{ marginBottom: 8 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10, color: '#94A3B8', marginBottom: 3 }}>
                    <span>All 14 Districts</span>
                    <span style={{ color: stats.coverageGap > 0 ? '#4ADE80' : stats.coverageGap < 0 ? '#F87171' : '#94A3B8' }}>
                      {stats.coverageGap > 0 ? `DT +${stats.coverageGap}` : stats.coverageGap < 0 ? `VV +${-stats.coverageGap}` : 'Tied'}
                    </span>
                  </div>
                  <div style={{ display: 'flex', gap: 4, alignItems: 'center', fontSize: 10 }}>
                    <span style={{ width: 18, color: '#22C55E', fontWeight: 700 }}>DT</span>
                    <div style={{ flex: 1, background: '#0F172A', borderRadius: 3, height: 16, position: 'relative', overflow: 'hidden' }}>
                      <div style={{ width: `${(stats.inDT/14)*100}%`, height: '100%', background: 'linear-gradient(90deg, #22C55E, #16A34A)', borderRadius: 3, transition: 'width 0.3s', display: 'flex', alignItems: 'center', justifyContent: 'flex-end', paddingRight: 4 }}>
                        <span style={{ fontSize: 10, fontWeight: 700, color: '#fff' }}>{stats.inDT}</span>
                      </div>
                    </div>
                  </div>
                  <div style={{ display: 'flex', gap: 4, alignItems: 'center', fontSize: 10, marginTop: 3 }}>
                    <span style={{ width: 18, color: '#3B82F6', fontWeight: 700 }}>VV</span>
                    <div style={{ flex: 1, background: '#0F172A', borderRadius: 3, height: 16, position: 'relative', overflow: 'hidden' }}>
                      <div style={{ width: `${(stats.inVV/14)*100}%`, height: '100%', background: 'linear-gradient(90deg, #3B82F6, #2563EB)', borderRadius: 3, transition: 'width 0.3s', display: 'flex', alignItems: 'center', justifyContent: 'flex-end', paddingRight: 4 }}>
                        <span style={{ fontSize: 10, fontWeight: 700, color: '#fff' }}>{stats.inVV}</span>
                      </div>
                    </div>
                  </div>
                </div>
                {/* Southern districts bar */}
                <div style={{ marginBottom: 4 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10, color: '#94A3B8', marginBottom: 3 }}>
                    <span>Southern Dallas (6 districts)</span>
                    <span style={{ color: stats.southernInDT > stats.southernInVV ? '#4ADE80' : '#F87171' }}>
                      {stats.southernInDT > stats.southernInVV ? `DT +${stats.southernInDT - stats.southernInVV}` : stats.southernInDT === stats.southernInVV ? 'Tied' : `VV +${stats.southernInVV - stats.southernInDT}`}
                    </span>
                  </div>
                  <div style={{ display: 'flex', gap: 4, alignItems: 'center', fontSize: 10 }}>
                    <span style={{ width: 18, color: '#22C55E', fontWeight: 700 }}>DT</span>
                    <div style={{ flex: 1, background: '#0F172A', borderRadius: 3, height: 16, position: 'relative', overflow: 'hidden' }}>
                      <div style={{ width: `${(stats.southernInDT/6)*100}%`, height: '100%', background: 'linear-gradient(90deg, #22C55E, #16A34A)', borderRadius: 3, transition: 'width 0.3s', display: 'flex', alignItems: 'center', justifyContent: 'flex-end', paddingRight: 4 }}>
                        <span style={{ fontSize: 10, fontWeight: 700, color: '#fff' }}>{stats.southernInDT}</span>
                      </div>
                    </div>
                  </div>
                  <div style={{ display: 'flex', gap: 4, alignItems: 'center', fontSize: 10, marginTop: 3 }}>
                    <span style={{ width: 18, color: '#3B82F6', fontWeight: 700 }}>VV</span>
                    <div style={{ flex: 1, background: '#0F172A', borderRadius: 3, height: 16, position: 'relative', overflow: 'hidden' }}>
                      <div style={{ width: `${(stats.southernInVV/6)*100}%`, height: '100%', background: stats.southernInVV === 0 ? '#DC2626' : 'linear-gradient(90deg, #3B82F6, #2563EB)', borderRadius: 3, transition: 'width 0.3s', minWidth: stats.southernInVV === 0 ? 0 : undefined, display: 'flex', alignItems: 'center', justifyContent: 'flex-end', paddingRight: 4 }}>
                        {stats.southernInVV > 0 && <span style={{ fontSize: 10, fontWeight: 700, color: '#fff' }}>{stats.southernInVV}</span>}
                      </div>
                      {stats.southernInVV === 0 && <span style={{ position: 'absolute', left: 24, top: '50%', transform: 'translateY(-50%)', fontSize: 9, color: '#DC2626', fontWeight: 700 }}>ZERO</span>}
                    </div>
                  </div>
                </div>
                {/* Population coverage */}
                <div style={{ marginTop: 8 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10, color: '#94A3B8', marginBottom: 3 }}>
                    <span>Population Reached (area-weighted)</span>
                    <span style={{ color: '#C8A951' }}>{((stats.popDT/TOTAL_POP)*100).toFixed(0)}% vs {((stats.popVV/TOTAL_POP)*100).toFixed(0)}%</span>
                  </div>
                  <div style={{ display: 'flex', gap: 4, alignItems: 'center', fontSize: 10 }}>
                    <span style={{ width: 18, color: '#22C55E', fontWeight: 700 }}>DT</span>
                    <div style={{ flex: 1, background: '#0F172A', borderRadius: 3, height: 16, position: 'relative', overflow: 'hidden' }}>
                      <div style={{ width: `${(stats.popDT/TOTAL_POP)*100}%`, height: '100%', background: 'linear-gradient(90deg, #22C55E, #16A34A)', borderRadius: 3, transition: 'width 0.3s', display: 'flex', alignItems: 'center', justifyContent: 'flex-end', paddingRight: 4 }}>
                        <span style={{ fontSize: 9, fontWeight: 700, color: '#fff' }}>{(stats.popDT/1000).toFixed(0)}K</span>
                      </div>
                    </div>
                  </div>
                  <div style={{ display: 'flex', gap: 4, alignItems: 'center', fontSize: 10, marginTop: 3 }}>
                    <span style={{ width: 18, color: '#3B82F6', fontWeight: 700 }}>VV</span>
                    <div style={{ flex: 1, background: '#0F172A', borderRadius: 3, height: 16, position: 'relative', overflow: 'hidden' }}>
                      <div style={{ width: `${(stats.popVV/TOTAL_POP)*100}%`, height: '100%', background: 'linear-gradient(90deg, #3B82F6, #2563EB)', borderRadius: 3, transition: 'width 0.3s', display: 'flex', alignItems: 'center', justifyContent: 'flex-end', paddingRight: 4 }}>
                        <span style={{ fontSize: 9, fontWeight: 700, color: '#fff' }}>{(stats.popVV/1000).toFixed(0)}K</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              {/* Stat cards */}
              <div style={{ padding: '4px 14px 8px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 }}>
                <StatCard label="DT Coverage" value={`${stats.inDT}/14`} sub={`${stats.popDT.toLocaleString()} residents`} color="#22C55E" />
                <StatCard label="VV Coverage" value={`${stats.inVV}/14`} sub={`${stats.popVV.toLocaleString()} residents`} color="#3B82F6" />
                <StatCard label="Full City Radius" value={`${dtMaxDist.toFixed(1)}`} sub="mi (Downtown)" color="#22C55E" />
                <StatCard label="Full City Radius" value={`${vvMaxDist.toFixed(1)}`} sub="mi (Valley View)" color="#3B82F6" />
              </div>

              {/* Equity callout — always show, content varies */}
              <div style={{
                margin: '0 14px 8px', padding: '10px 12px',
                background: '#1E293B', borderRadius: 6,
                borderLeft: '3px solid #DC2626'
              }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: '#DC2626', marginBottom: 4, textTransform: 'uppercase', letterSpacing: 0.5 }}>
                  Equity Impact — Southern Dallas
                </div>
                {stats.southernLosing.length > 0 ? (
                  <div style={{ fontSize: 12, color: '#E2E8F0', lineHeight: 1.5 }}>
                    <strong style={{ color: '#F87171' }}>
                    {stats.southernLosing.length} Southern district{stats.southernLosing.length !== 1 ? 's' : ''}
                    </strong> lose{stats.southernLosing.length === 1 ? 's' : ''} access at Valley View:
                    {' '}{stats.southernLosing.map(d => `D${d.d}`).join(', ')}.
                    <br/><span style={{ fontSize: 11, color: '#94A3B8' }}>Valley View reaches <strong style={{ color: '#F87171' }}>{stats.southernInVV}/6</strong> Southern districts vs Downtown's <strong style={{ color: '#4ADE80' }}>{stats.southernInDT}/6</strong>.</span>
                  </div>
                ) : (
                  <div style={{ fontSize: 12, color: '#E2E8F0', lineHeight: 1.5 }}>
                    Downtown reaches <strong style={{ color: '#4ADE80' }}>{stats.southernInDT}/6</strong> Southern districts; Valley View reaches <strong style={{ color: stats.southernInVV === 0 ? '#F87171' : '#60A5FA' }}>{stats.southernInVV}/6</strong>.
                    {stats.southernInVV === 0 && <span style={{ color: '#F87171' }}> Valley View serves zero Southern Dallas residents at this radius.</span>}
                  </div>
                )}
                <div style={{ fontSize: 11, color: '#94A3B8', marginTop: 6, lineHeight: 1.4 }}>
                  Southern Dallas — home to <strong style={{ color: '#C8A951' }}>{SOUTHERN_POP.toLocaleString()} residents (42% of the city)</strong> — provided the <strong style={{ color: '#C8A951' }}>1,642-vote margin</strong> in the 1998 arena bond election.
                </div>
              </div>

              {/* Transit callout */}
              <div style={{
                margin: '0 14px 8px', padding: '10px 12px',
                background: '#1E293B', borderRadius: 6,
                borderLeft: '3px solid #3B82F6'
              }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: '#3B82F6', marginBottom: 4, textTransform: 'uppercase', letterSpacing: 0.5 }}>
                  DART Rail Lines (shown on map)
                </div>
                <div style={{ fontSize: 12, color: '#E2E8F0', lineHeight: 1.5 }}>
                  <strong>Downtown:</strong> <span style={{ color: '#006F38' }}>Green</span>, <span style={{ color: '#F68B1F' }}>Orange</span>, <span style={{ color: '#FD3E3E' }}>Red</span>, <span style={{ color: '#198BC3' }}>Blue</span> lines
                </div>
                <div style={{ fontSize: 12, color: '#E2E8F0', lineHeight: 1.5, marginTop: 3 }}>
                  <strong>Valley View:</strong> <span style={{ color: '#F87171' }}>Zero rail access</span> — nearest station ~3 mi away
                </div>
                <div style={{ display: 'flex', gap: 10, marginTop: 6, flexWrap: 'wrap' }}>
                  {[{n:'Red',c:'#FD3E3E'},{n:'Blue',c:'#198BC3'},{n:'Green',c:'#006F38'},{n:'Orange',c:'#F68B1F'}].map(l => (
                    <div key={l.n} style={{ display: 'flex', alignItems: 'center', gap: 4, fontSize: 10 }}>
                      <div style={{ width: 16, height: 2, background: l.c, borderRadius: 1 }}></div>
                      <span style={{ color: l.c }}>{l.n}</span>
                    </div>
                  ))}
                </div>
              </div>

              {/* Downtown Advantage Summary */}
              <div style={{
                margin: '0 14px 14px', padding: '12px 14px',
                background: 'linear-gradient(135deg, #0F2318 0%, #0F172A 100%)',
                borderRadius: 6, border: '1px solid #22C55E'
              }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: '#22C55E', marginBottom: 8, textTransform: 'uppercase', letterSpacing: 0.5 }}>
                  Why Downtown Is the Better Location
                </div>
                <div style={{ fontSize: 12, color: '#E2E8F0', lineHeight: 1.6 }}>
                  {[
                    { icon: '1', text: <><strong style={{ color: '#4ADE80' }}>More equitable reach.</strong> Downtown covers {stats.inDT}/14 districts vs Valley View's {stats.inVV}/14 at {radius} mi — serving <strong style={{ color: '#C8A951' }}>{(stats.popDT - stats.popVV).toLocaleString()} more residents</strong>.</> },
                    { icon: '2', text: <><strong style={{ color: '#4ADE80' }}>Southern Dallas access.</strong> Downtown reaches {stats.southernInDT}/6 Southern districts; Valley View reaches only {stats.southernInVV}/6. Southern Dallas — 42% of the city — provided the 1,642-vote margin that built the current arena.</> },
                    { icon: '3', text: <><strong style={{ color: '#4ADE80' }}>Full transit connectivity.</strong> Downtown sits on all 4 DART rail lines (Green, Orange, Red, Blue). Valley View has <strong style={{ color: '#F87171' }}>zero</strong> rail access — the nearest station is ~3 miles away.</> },
                    { icon: '4', text: <><strong style={{ color: '#4ADE80' }}>Shorter max distance.</strong> The farthest district is {dtMaxDist.toFixed(1)} mi from Downtown vs {vvMaxDist.toFixed(1)} mi from Valley View — Downtown is closer to the geographic center of the city.</> },
                  ].map((item, i) => (
                    <div key={i} style={{ display: 'flex', gap: 8, marginBottom: i < 3 ? 8 : 0 }}>
                      <div style={{
                        width: 20, height: 20, borderRadius: '50%',
                        background: '#22C55E', color: '#0B0F19',
                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                        fontSize: 11, fontWeight: 800, flexShrink: 0, marginTop: 1
                      }}>{item.icon}</div>
                      <div>{item.text}</div>
                    </div>
                  ))}
                </div>
                <div style={{ fontSize: 9, color: '#475569', marginTop: 10, lineHeight: 1.4, borderTop: '1px solid #1E293B', paddingTop: 8 }}>
                  Data: 2020 U.S. Census via City of Dallas GIS. Distances are Haversine straight-line from district centroids. Population counts are area-weighted.
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── Stat Card Component ──
    function StatCard({ label, value, sub, color }) {
      return (
        <div style={{
          background: '#1E293B', borderRadius: 6, padding: '10px 12px',
          borderTop: `2px solid ${color}`
        }}>
          <div style={{ fontSize: 10, color: '#94A3B8', textTransform: 'uppercase', letterSpacing: 0.5 }}>{label}</div>
          <div style={{ fontSize: 22, fontWeight: 800, color, marginTop: 2 }}>{value}</div>
          <div style={{ fontSize: 10, color: '#64748B' }}>{sub}</div>
        </div>
      );
    }

    // ── Render ──
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
